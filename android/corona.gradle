// corona.gradle — injected by CoronaBuilder into the end-user app's Gradle build.
// Pulls IronSource (Unity LevelPlay) SDK at app-build time.

repositories {
    google()
    mavenCentral()
}

// Exclude legacy standalone kotlin-stdlib-jdk7/jdk8 to avoid duplicate class
// conflicts when Solar2D brings in an older kotlin-stdlib-jdk* alongside
// IronSource SDK 9.x which transitively requires kotlin-stdlib 1.8+.
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'com.unity3d.ads-mediation:mediation-sdk:9.3.0'

    // LevelPlay network adapters (Google AdMob, AppLovin, Unity Ads, Liftoff/Vungle).
    // Without them LevelPlay can only fill from the ironSource network itself
    // (Fun Mahjong: 5 impressions in 30 days). Versions match the set Fun Big2
    // HK/TW ship on mediation-sdk 9.3.0 in production. Titles must declare the
    // AdMob APPLICATION_ID meta-data in their manifest (AdMob throws at startup
    // without it).
    implementation 'com.unity3d.ads-mediation:admob-adapter:4.3.53'
    implementation 'com.google.android.gms:play-services-ads:24.5.0'
    implementation 'com.unity3d.ads-mediation:applovin-adapter:4.3.55'
    implementation 'com.applovin:applovin-sdk:13.4.0'
    implementation 'com.unity3d.ads-mediation:unityads-adapter:4.3.63'
    implementation 'com.unity3d.ads:unity-ads:4.16.5'
    implementation 'com.unity3d.ads-mediation:vungle-adapter:4.3.31'
    implementation 'com.vungle:vungle-ads:7.5.1'
}
